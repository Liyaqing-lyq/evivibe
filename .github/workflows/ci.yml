name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest migrated to Ubuntu 26.04 (Oct 2026), where Python 3.9
        # has no prebuilt package. Pin ubuntu-24.04 to keep the declared
        # >=3.9 support testable.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Selftest (offline demo evaluation)
        run: evivibe selftest
      - name: Unit & end-to-end tests
        run: pytest -v
